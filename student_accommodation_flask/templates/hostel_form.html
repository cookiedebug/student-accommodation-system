{% extends "base.html" %}{% block title %}Add Accommodation | {{ app_name }}{% endblock %}
{% block content %}<div class="auth wide"><form class="panel" method="post" enctype="multipart/form-data"><span class="eyebrow">{% if current_user and current_user['role']=='admin' %}ADMINISTRATOR{% else %}LANDLORD / AGENT{% endif %}</span><h1>Add accommodation</h1><div class="form-grid"><div><label>Hostel name</label><input name="name" required></div><div><label>Region</label><select name="region" data-university-target="#hostel-university" required><option value="">Select region</option>{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select></div><div class="span-2"><label>University / campus</label><select name="university" id="hostel-university" required><option value="">Select university</option></select></div><div><label>City / town</label><input name="city" required></div><div><label>Address / area</label><input name="address"></div><div><label>First room type</label><select name="room_type"><option>Single</option><option>Double</option><option>Shared</option></select></div><div><label>Monthly price (GH₵)</label><input name="price" type="number" required></div><div><label>Total rooms</label><input name="total_rooms" type="number" required></div><div><label>Available rooms</label><input name="available_rooms" type="number" required></div></div><label>Description</label><textarea name="description" rows="4"></textarea><label>Facilities</label><input name="facilities" placeholder="Wi-Fi, Security, Laundry, Parking..."><label>Hostel pictures</label>{% include "_upload_panel.html" %}<button class="btn">Submit for approval</button></form></div>{% endblock %}
