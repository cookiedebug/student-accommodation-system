<div class="upload-panel">
  <div class="upload-drop">
    <input type="file" name="{{ field_name|default('photos') }}" accept="image/jpeg,image/png,image/webp,image/gif"{% if multiple|default(true) %} multiple{% endif %} data-preview>
    <strong>Drop your pictures here or click to browse</strong>
    <small>JPG, PNG, WEBP or GIF · up to 5MB each</small>
  </div>
  <div class="upload-previews"></div>
</div>
{% if photos is defined and photos %}
<div class="photo-grid">
  {% for p in photos %}
  <figure>
    <img src="{{ media_url(p['path']) }}" alt="Uploaded photo">
    <form method="post" action="{{ url_for('delete_photo', photo_id=p['id']) }}">
      <button class="btn danger small" type="submit">Remove</button>
    </form>
  </figure>
  {% endfor %}
</div>
{% endif %}
