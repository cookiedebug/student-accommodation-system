{% extends "base.html" %}{% block title %}Create Account | {{ app_name }}{% endblock %}
{% block content %}<div class="auth"><form class="panel" method="post"><h1>Create your account</h1><label>Full name</label><input name="full_name" required><label>Email</label><input name="email" type="email" required><label>Phone</label><input name="phone"><label>Region</label><select data-university-target="#reg-university"><option value="">All Ghana</option>{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select><label>University</label><select name="institution" id="reg-university"><option value="">Select university</option>{% for u in universities %}<option>{{ u }}</option>{% endfor %}</select><label>Account type</label><select name="role"><option value="student">Student</option><option value="manager">Landlord / Agent</option></select><label>Password</label><input name="password" type="password" minlength="6" required><button class="btn full">Create Account</button></form></div>{% endblock %}
